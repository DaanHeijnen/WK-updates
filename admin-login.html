<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin login - Oranje Updates</title>
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body data-page="login">
  <main class="auth-page">
    <section class="panel auth-panel">
      <p class="eyebrow">Beheer</p>
      <h1>Inloggen</h1>
      <form id="login-form" class="form">
        <label>E-mailadres<input type="email" name="email" autocomplete="email" required></label>
        <label>Wachtwoord<input type="password" name="password" autocomplete="current-password" required></label>
        <button class="btn btn-primary" type="submit">Log in</button>
        <p id="login-error" class="error-message" hidden></p>
      </form>
    </section>
  </main>
  <script src="assets/js/app.js"></script>
</body>
</html>
